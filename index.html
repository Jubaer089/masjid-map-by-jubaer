<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
margin:0;
font-family:Arial;
background:url("Ramadan Mubarak.png") center/cover no-repeat;
color:white;
}

.top{
display:flex;
justify-content:space-around;
padding:20px;
}

button{
font-size:26px;
padding:10px;
}

.panel{
display:none;
background:rgba(0,0,0,0.7);
margin:20px;
padding:20px;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin:5px 0;
font-size:18px;
}

.day{
display:inline-block;
width:40px;
height:40px;
margin:3px;
text-align:center;
line-height:40px;
background:white;
color:black;
border-radius:5px;
}

.red{
background:red;
color:white;
}
</style>
</head>
<body>

<div class="top">
<button onclick="show('search')">🔍</button>
<button onclick="show('add')">➕</button>
<button onclick="show('cal')">📅</button>
</div>

<div id="search" class="panel">
<input id="q" placeholder="Search masjid or ward">
<button onclick="search()">Search</button>
<div id="out"></div>
</div>

<div id="add" class="panel">
<input id="ward" placeholder="Ward">
<input id="masjid" placeholder="Masjid">
<input id="food" placeholder="Food">
<input id="time" type="datetime-local">
<button onclick="save()">Save</button>
</div>

<div id="cal" class="panel">
<div id="grid"></div>
</div>

<script>
const URL="https://api.jsonstorage.net/v1/json/34f53f08-8af0-4bc8-bca9-4cff6c1d78e4/681f130b-d263-42c4-9b40-96859d7feadd";

let data=[];

function show(id){
document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
document.getElementById(id).style.display='block';
}

async function load(){
try{
const r=await fetch(URL);
data=await r.json();
if(!Array.isArray(data)) data=[];
}catch{data=[]}
draw();
}
load();

async function save(){
data.push({
ward:ward.value,
masjid:masjid.value,
food:food.value,
time:time.value,
verified:false
});

await fetch(URL,{
method:"PATCH",
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
});

alert("Saved — refresh to see");
}

function search(){
out.innerHTML="";
const s=q.value.toLowerCase();
const res=data.filter(e=>e.masjid.toLowerCase().includes(s)||e.ward.includes(s));
if(res.length===0){out.innerHTML="No data";return;}
res.forEach(e=>{
out.innerHTML+=`<div>${e.masjid} | Ward ${e.ward} | ${e.food} | ${new Date(e.time).toLocaleString()}</div>`;
});
}

function draw(){
grid.innerHTML="";
for(let i=1;i<=31;i++){
const d=document.createElement("div");
d.className="day";
if(data.some(e=>new Date(e.time).getDate()===i)) d.classList.add("red");
d.textContent=i;
grid.appendChild(d);
}
}
</script>

</body>
</html>
