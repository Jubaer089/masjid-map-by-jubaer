<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Iftar Finder</title>
  <style>
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background:url('Ramadan Mubarak.png') no-repeat center center fixed;
      background-size:cover;
      color:white;
    }
    .topbar {
      position:fixed;
      top:10px;
      right:10px;
      display:flex;
      gap:10px;
    }
    button {
      padding:10px;
      font-size:16px;
      cursor:pointer;
    }
    .panel {
      margin-top:80px;
      padding:20px;
      background:rgba(0,0,0,0.6);
      max-width:600px;
    }
    input {display:block; margin:5px 0; padding:8px; width:100%;}
    .result {margin-top:10px; padding:10px; background:rgba(255,255,255,0.1);} 
  </style>
</head>
<body>

<div class="topbar">
  <button onclick="showAdd()">➕</button>
  <button onclick="showSearch()">🔍</button>
</div>

<div id="addPanel" class="panel" style="display:none">
  <h3>Add Iftar</h3>
  <input id="district" placeholder="District">
  <input id="upazila" placeholder="Upazila">
  <input id="ward" placeholder="Ward">
  <input id="masjid" placeholder="Masjid Name">
  <input id="food" placeholder="Food Item">
  <input id="date" type="date">
  <input id="time" type="time">
  <button onclick="saveData()">Save</button>
</div>

<div id="searchPanel" class="panel" style="display:none">
  <h3>Search</h3>
  <input id="searchBox" placeholder="Masjid or Ward" oninput="searchData()">
  <div id="results"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "PASTE_KEY",
    authDomain: "PASTE_DOMAIN",
    projectId: "PASTE_PROJECT",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const colRef = collection(db, "iftar");

  window.showAdd = ()=>{
    addPanel.style.display='block';
    searchPanel.style.display='none';
  }

  window.showSearch = ()=>{
    addPanel.style.display='none';
    searchPanel.style.display='block';
  }

  window.saveData = async ()=>{
    await addDoc(colRef, {
      district: district.value,
      upazila: upazila.value,
      ward: ward.value,
      masjid: masjid.value,
      food: food.value,
      date: date.value,
      time: time.value,
      trueVotes:0,
      falseVotes:0
    });
    alert('Saved — everyone can see');
  }

  let allData=[];

  onSnapshot(colRef, snap=>{
    allData = snap.docs.map(d=>({id:d.id, ...d.data()}));
  });

  window.searchData = ()=>{
    const q = searchBox.value.toLowerCase();
    results.innerHTML='';
    const filtered = allData.filter(x=>
      x.masjid.toLowerCase().includes(q) || x.ward.toLowerCase().includes(q)
    );

    if(filtered.length===0){
      results.innerHTML='No data';
      return;
    }

    filtered.forEach(item=>{
      const div=document.createElement('div');
      div.className='result';
      div.innerHTML=`
        <b>${item.masjid}</b><br>
        Ward: ${item.ward}<br>
        Food: ${item.food}<br>
        Date: ${item.date} ${item.time}<br>
        ✅ True: ${item.trueVotes} ❌ False: ${item.falseVotes}<br>
        <button onclick="vote('${item.id}','true')">True</button>
        <button onclick="vote('${item.id}','false')">False</button>
      `;
      results.appendChild(div);
    });
  }

  window.vote = async (id,type)=>{
    const item = allData.find(x=>x.id===id);
    const ref = doc(db,'iftar',id);
    if(type==='true'){
      await updateDoc(ref,{trueVotes:item.trueVotes+1});
    } else {
      await updateDoc(ref,{falseVotes:item.falseVotes+1});
    }
  }
</script>

</body>
</html>
