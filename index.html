<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Iftar Map</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background-image:url("https://raw.githubusercontent.com/Jubaer089/masjid-map-by-jubaer/main/Ramadan%20Mubarak.png");
  background-size:cover;
  background-position:center;
  color:white;
}

.overlay {
  background: rgba(0,0,0,0.6);
  min-height:100vh;
  padding:20px;
}

.topbar {
  display:flex;
  justify-content:flex-end;
  gap:20px;
  font-size:28px;
  cursor:pointer;
}

.box {
  background:white;
  color:black;
  padding:20px;
  border-radius:10px;
  max-width:400px;
  margin:20px auto;
  display:none;
}

input, button {
  width:100%;
  padding:10px;
  margin:5px 0;
}

.result {
  background:white;
  color:black;
  padding:10px;
  margin:10px;
  border-radius:8px;
}

.calendar-day {
  display:inline-block;
  width:40px;
  height:40px;
  margin:3px;
  text-align:center;
  line-height:40px;
  border-radius:5px;
  background:white;
  color:black;
}
.event {
  background:red;
  color:white;
}
</style>
</head>

<body>
<div class="overlay">

<div class="topbar">
<span onclick="toggleSearch()">🔍</span>
<span onclick="toggleAdd()">➕</span>
<span onclick="toggleCalendar()">📅</span>
</div>

<!-- ADD BOX -->
<div id="addBox" class="box">
<h3>Add Iftar</h3>
<input id="ward" placeholder="Ward number / ওয়ার্ড">
<input id="masjid" placeholder="Masjid name / মসজিদের নাম">
<input id="food" placeholder="Food item">
<input id="datetime" type="datetime-local">
<button onclick="saveData()">Save</button>
</div>

<!-- SEARCH BOX -->
<div id="searchBox" class="box">
<input id="searchInput" placeholder="Search masjid or ward">
<button onclick="searchData()">Search</button>
<div id="results"></div>
</div>

<!-- CALENDAR -->
<div id="calendarBox" class="box"></div>

</div>

<script>
function toggleAdd(){
 document.getElementById("addBox").style.display="block";
 document.getElementById("searchBox").style.display="none";
 document.getElementById("calendarBox").style.display="none";
}
function toggleSearch(){
 document.getElementById("searchBox").style.display="block";
 document.getElementById("addBox").style.display="none";
 document.getElementById("calendarBox").style.display="none";
}
function toggleCalendar(){
 document.getElementById("calendarBox").style.display="block";
 document.getElementById("addBox").style.display="none";
 document.getElementById("searchBox").style.display="none";
 renderCalendar();
}

function getData(){
 return JSON.parse(localStorage.getItem("iftarData")||"[]");
}
function setData(data){
 localStorage.setItem("iftarData", JSON.stringify(data));
}

function saveData(){
 let data=getData();
 data.push({
  ward:ward.value,
  masjid:masjid.value,
  food:food.value,
  datetime:datetime.value,
  verified:false
 });
 setData(data);
 alert("Saved!");
}

function searchData(){
 let q=searchInput.value.toLowerCase();
 let data=getData();
 results.innerHTML="";
 let found=false;

 data.forEach((d,i)=>{
  if(d.masjid.toLowerCase().includes(q)||d.ward.toLowerCase().includes(q)){
   found=true;
   let div=document.createElement("div");
   div.className="result";
   div.innerHTML=`
   <b>${d.masjid}</b><br>
   Ward: ${d.ward}<br>
   Food: ${d.food}<br>
   Time: ${d.datetime}<br>
   Verified: ${d.verified}
   <button onclick="verify(${i})">Toggle Verify</button>
   `;
   results.appendChild(div);
  }
 });

 if(!found) results.innerHTML="No data";
}

function verify(i){
 let data=getData();
 data[i].verified=!data[i].verified;
 setData(data);
 searchData();
}

function renderCalendar(){
 let data=getData();
 calendarBox.innerHTML="";
 for(let d=1; d<=31; d++){
  let div=document.createElement("div");
  div.className="calendar-day";
  div.textContent=d;

  let hasEvent=data.some(e=>{
   if(!e.datetime) return false;
   return new Date(e.datetime).getDate()===d;
  });

  if(hasEvent) div.classList.add("event");
  calendarBox.appendChild(div);
 }
}
</script>

</body>
</html>
