<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iftar Map</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:url("Ramadan Mubarak.png") no-repeat center/cover;
  min-height:100vh;
  color:white;
}

.topbar {
  display:flex;
  justify-content:space-around;
  padding:20px;
  font-size:32px;
}

button {
  font-size:22px;
  padding:12px;
  margin:5px;
}

.panel {
  background:rgba(0,0,0,0.7);
  padding:20px;
  margin:20px;
  border-radius:12px;
  display:none;
}

input {
  width:100%;
  padding:12px;
  margin:6px 0;
  font-size:18px;
}

.event {
  border-bottom:1px solid #aaa;
  padding:10px;
}

.calendar-day {
  display:inline-block;
  width:40px;
  height:40px;
  line-height:40px;
  margin:3px;
  text-align:center;
  border-radius:6px;
  background:white;
  color:black;
}

.red {
  background:red;
  color:white;
}
</style>
</head>

<body>

<div class="topbar">
<button onclick="toggle('search')">🔍</button>
<button onclick="toggle('add')">➕</button>
<button onclick="toggle('calendar')">📅</button>
</div>

<div id="search" class="panel">
<input id="searchBox" placeholder="Search masjid or ward">
<button onclick="search()">Search</button>
<div id="results"></div>
</div>

<div id="add" class="panel">
<input id="ward" placeholder="Ward number">
<input id="masjid" placeholder="Masjid name">
<input id="food" placeholder="Food item">
<input id="datetime" type="datetime-local">
<button onclick="save()">Save</button>
</div>

<div id="calendar" class="panel">
<div id="calendarGrid"></div>
</div>

<script>
const API="https://api.jsonstorage.net/v1/json/34f53f08-8af0-4bc8-bca9-4cff6c1d78e4/681f130b-d263-42c4-9b40-96859d7feadd";

let data=[];

function toggle(id){
  document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
  document.getElementById(id).style.display="block";
}

async function load(){
  try{
    const res=await fetch(API);
    data=await res.json();
    if(!Array.isArray(data)) data=[];
  }catch{ data=[] }
  renderCalendar();
}
load();

async function save(){
  const event={
    ward:ward.value,
    masjid:masjid.value,
    food:food.value,
    datetime:datetime.value,
    verified:false
  };
  data.push(event);

  await fetch(API,{
    method:"PUT",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  });

  alert("Saved!");
  load();
}

function search(){
  const q=searchBox.value.toLowerCase();
  results.innerHTML="";

  const matches=data.filter(e =>
    e.masjid.toLowerCase().includes(q) ||
    e.ward.toLowerCase().includes(q)
  );

  if(matches.length===0){
    results.innerHTML="No data";
    return;
  }

  matches.forEach(e=>{
    const div=document.createElement("div");
    div.className="event";

    const btn=document.createElement("button");
    btn.textContent=e.verified ? "Verified ✅" : "Verify";
    btn.onclick=()=>verify(e);

    div.innerHTML=`
      <b>${e.masjid}</b><br>
      Ward: ${e.ward}<br>
      Food: ${e.food}<br>
      ${new Date(e.datetime).toLocaleString()}
    `;
    div.appendChild(btn);
    results.appendChild(div);
  });
}

async function verify(event){
  event.verified=true;
  await fetch(API,{
    method:"PUT",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  });
  search();
}

function renderCalendar(){
  calendarGrid.innerHTML="";
  const days=31;

  for(let i=1;i<=days;i++){
    const div=document.createElement("div");
    div.className="calendar-day";

    const has=data.some(e=>{
      if(!e.datetime) return false;
      return new Date(e.datetime).getDate()===i;
    });

    if(has) div.classList.add("red");

    div.textContent=i;
    calendarGrid.appendChild(div);
  }
}
</script>

</body>
</html>
