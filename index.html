<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইফতার তথ্য</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('ramadan.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    .topbar {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .panel {
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 12px;
      margin: 80px auto;
      width: 90%;
      max-width: 400px;
      display: none;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      border-radius: 6px;
      border: none;
    }
    .result {
      margin-top: 10px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="topbar">
  <button onclick="showSearch()">🔍</button>
  <button onclick="showAdd()">➕</button>
</div>

<div id="searchPanel" class="panel">
  <h3>খুঁজুন</h3>
  <input id="searchInput" placeholder="মসজিদের নাম বা ওয়ার্ড">
  <button onclick="searchData()">Search</button>
  <div id="results" class="result"></div>
</div>

<div id="addPanel" class="panel">
  <h3>নতুন তথ্য যোগ করুন</h3>
  <input id="ward" placeholder="ওয়ার্ড নম্বর">
  <input id="masjid" placeholder="মসজিদের নাম">
  <button onclick="saveData()">Save</button>
</div>

<script>
async function loadData() {
  const res = await fetch('data.json');
  return await res.json();
}

function showSearch() {
  document.getElementById('searchPanel').style.display = 'block';
  document.getElementById('addPanel').style.display = 'none';
}

function showAdd() {
  document.getElementById('addPanel').style.display = 'block';
  document.getElementById('searchPanel').style.display = 'none';
}

async function searchData() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const data = await loadData();
  const results = data.filter(d =>
    d.masjid.toLowerCase().includes(q) || d.ward.toLowerCase().includes(q)
  );
  const div = document.getElementById('results');
  if (results.length === 0) {
    div.innerHTML = 'কোনো তথ্য পাওয়া যায়নি';
  } else {
    div.innerHTML = results.map(r =>
      `<div>ওয়ার্ড: ${r.ward}<br>মসজিদ: ${r.masjid}</div><hr>`
    ).join('');
  }
}

function saveData() {
  alert('নতুন তথ্য data.json এ যোগ করুন — GitHub এ গিয়ে edit করে commit করুন');
}
</script>

</body>
</html>
