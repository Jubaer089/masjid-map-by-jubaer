<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khulna Masjid Food Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; }
    .searchBox {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    input, button { padding: 6px; }
  </style>
</head>
<body>
  <div class="searchBox">
    <input id="search" placeholder="Search in Khulna" />
    <button onclick="searchPlace()">Go</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Map centered on Khulna
    const map = L.map('map').setView([22.8456, 89.5403], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Sample masjids in Khulna (add more as needed)
    const masjids = [
      { name: 'Masjid Al-Falah', lat: 22.8450, lng: 89.5400 },
      { name: 'Baitul Aman Mosque', lat: 22.8462, lng: 89.5440 },
      { name: 'Khulna Jame Masjid', lat: 22.8430, lng: 89.5370 }
    ];

    function getData() {
      return JSON.parse(localStorage.getItem('masjidData') || '{}');
    }

    function saveData(data) {
      localStorage.setItem('masjidData', JSON.stringify(data));
    }

    // Add markers
    masjids.forEach(m => {
      const marker = L.marker([m.lat, m.lng]).addTo(map);
      marker.bindPopup(`<b>${m.name}</b><br><button onclick="addInfo('${m.name}')">+ Add Info</button>`);
    });

    // Add info popup
    function addInfo(name) {
      const date = prompt('Date (e.g., 22-02-2026):');
      const food = prompt('Food (biryani/tehari + chicken/beef):');
      const comment = prompt('Comment:');

      if (!date || !food) return alert('Date and food required');

      const data = getData();
      if (!data[name]) data[name] = [];
      data[name].push({ date, food, comment });
      saveData(data);

      alert('Info saved locally!');
    }

    // Search function (Khulna only)
    function searchPlace() {
      const query = document.getElementById('search').value + ', Khulna, Bangladesh';
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`, {
        headers: { 
          'Accept': 'application/json', 
          'User-Agent': 'khulna-masjid-map-2026 (your-email@example.com)' 
        }
      })
      .then(response => response.json())
      .then(data => {
        if (data && data.length > 0) {
          const place = data[0];
          map.setView([place.lat, place.lon], 16);
        } else {
          alert('Place not found in Khulna');
        }
      })
      .catch(err => alert('Error searching place'));
    }
  </script>
</body>
</html>
